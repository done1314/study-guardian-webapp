<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f2f2f7" />
  <title>日课 · 学习督促</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>
  <div class="scroll-edge" aria-hidden="true"></div>

  <header class="topbar glass">
    <button class="icon-button" id="todayShortcut" aria-label="回到今天">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9"/><path d="M12 7v5l3 2"/><path d="M17 3h4v4"/></svg>
    </button>
    <div class="brand">日课</div>
    <button class="icon-button" id="openSettings" aria-label="设置">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21h-4v-.1A1.7 1.7 0 0 0 8.6 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H3v-4h.1A1.7 1.7 0 0 0 4.6 8.6a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V3h4v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 9c.16.38.37.72.6 1 .28.25.66.39 1.1.4h.1v4h-.1a1.7 1.7 0 0 0-1.7.6Z"/></svg>
    </button>
  </header>

  <main>
    <section class="view active" id="todayView" aria-labelledby="todayTitle">
      <div class="hero">
        <p class="eyebrow" id="fullDate"></p>
        <h1 id="todayTitle">今天，稳稳向前。</h1>
        <div class="hero-progress">
          <div class="progress-ring" id="progressRing" role="img" aria-label="今日完成进度">
            <span id="progressValue">0%</span>
          </div>
          <p id="progressMessage">完成两项日课，就算赢下今天。</p>
        </div>
      </div>

      <div class="date-strip" id="dateStrip" aria-label="选择日期"></div>

      <section class="section-block" aria-labelledby="taskHeading">
        <div class="section-heading">
          <h2 id="taskHeading">今日任务</h2>
          <span id="totalDuration">共 120 分钟</span>
        </div>
        <div id="taskList"></div>
      </section>

      <aside class="note-card">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-4 12.75V18h8v-3.25A7 7 0 0 0 12 2Z"/><path d="M9 22h6M9 18h6"/></svg>
        <div><strong>完成标准</strong><p>数学上传笔记或演算过程，英语上传阅读原文与批注。照片审核留给未来的督促人功能。</p></div>
      </aside>
    </section>

    <section class="view" id="planView" aria-labelledby="planTitle">
      <div class="page-head">
        <p class="eyebrow">学习路径</p>
        <h1 id="planTitle">一日一课，逐步完成。</h1>
        <p>数学按夸克网盘这一级目录每天完成一个文件夹；英语每天完成一篇阅读。</p>
      </div>
      <div class="plan-summary" id="planSummary"></div>
      <div class="section-heading catalog-heading"><h2>数学课程目录</h2><span id="courseCount"></span></div>
      <div class="catalog" id="courseCatalog"></div>
    </section>

    <section class="view" id="progressView" aria-labelledby="progressTitle">
      <div class="page-head">
        <p class="eyebrow">学习记录</p>
        <h1 id="progressTitle">坚持，会被看见。</h1>
        <p>所有数据只保存在这台设备的浏览器中。</p>
      </div>
      <div class="stats-grid" id="statsGrid"></div>
      <section class="section-block history-block">
        <div class="section-heading"><h2>最近打卡</h2></div>
        <div class="history-list" id="historyList"></div>
      </section>
    </section>
  </main>

  <nav class="tabbar glass" aria-label="主导航">
    <button class="tab active" data-view="todayView" aria-current="page"><svg viewBox="0 0 24 24"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10M9 20v-6h6v6"/></svg><span>今天</span></button>
    <button class="tab" data-view="planView"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 17h.01M12 17h.01"/></svg><span>计划</span></button>
    <button class="tab" data-view="progressView"><svg viewBox="0 0 24 24"><path d="M4 19V9M10 19V5M16 19v-7M22 19V3"/></svg><span>进度</span></button>
  </nav>

  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <section class="sheet" id="durationSheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
    <div class="grabber"></div>
    <div class="sheet-bar"><button class="text-button" data-close-sheet>取消</button><h2 id="sheetTitle">设置时长</h2><button class="text-button strong" id="saveDuration">完成</button></div>
    <div class="sheet-body">
      <p id="durationSubject"></p>
      <label class="duration-input"><input id="durationInput" type="number" min="5" max="480" step="5" inputmode="numeric" /><span>分钟</span></label>
      <div class="preset-row" id="presetRow"><button>30</button><button>45</button><button>60</button><button>90</button></div>
    </div>
  </section>

  <section class="sheet" id="settingsSheet" role="dialog" aria-modal="true" aria-labelledby="settingsTitle" hidden>
    <div class="grabber"></div>
    <div class="sheet-bar"><button class="text-button" data-close-sheet>取消</button><h2 id="settingsTitle">计划设置</h2><button class="text-button strong" id="saveSettings">完成</button></div>
    <div class="sheet-body settings-body">
      <label>数学默认时长<span><input id="mathDefault" type="number" min="5" max="480" step="5" /> 分钟</span></label>
      <label>英语默认时长<span><input id="englishDefault" type="number" min="5" max="480" step="5" /> 分钟</span></label>
      <p>新设置从尚未单独调整的日期开始生效。</p>
    </div>
  </section>

  <template id="taskTemplate">
    <article class="task-card">
      <div class="task-top">
        <div class="subject-icon"></div>
        <div class="task-copy"><p class="subject-label"></p><h3></h3><p class="task-detail"></p></div>
        <button class="duration-pill" aria-label="设置任务时长"></button>
      </div>
      <div class="proof-area">
        <input class="photo-input" type="file" accept="image/*" capture="environment" hidden />
        <button class="upload-button"><svg viewBox="0 0 24 24"><path d="M4 7h3l1.5-2h7L17 7h3v12H4Z"/><circle cx="12" cy="13" r="4"/></svg><span>拍照上传</span></button>
        <div class="proof-preview" hidden><img alt="学习内容证明"/><div><strong>照片已添加</strong><span class="proof-name"></span></div><button class="replace-proof">更换</button></div>
        <button class="complete-button" disabled>上传照片后打卡</button>
      </div>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
